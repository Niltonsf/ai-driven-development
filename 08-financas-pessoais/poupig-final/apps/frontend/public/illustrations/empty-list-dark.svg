<svg viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustracao de lista vazia">
  <defs>
    <linearGradient id="el-bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="el-card" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="el-accent" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e4e4e7"/>
      <stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="el-accent-v" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <radialGradient id="el-glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#3b4a66" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#3b4a66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="el-center-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="700" rx="24" fill="url(#el-bg)"/>
  <rect x="150" y="60" width="900" height="580" rx="100" fill="url(#el-glow)"/>

  <!-- main panel -->
  <rect x="80" y="80" width="1040" height="540" rx="24" fill="#0c1424" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- topbar -->
  <rect x="120" y="116" width="220" height="22" rx="11" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="120" y="148" width="140" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="860" y="118" width="120" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="996" y="118" width="90" height="38" rx="10" fill="url(#el-accent)" fill-opacity="0.12" stroke="url(#el-accent)" stroke-opacity="0.3" stroke-width="1"/>

  <!-- search bar -->
  <rect x="120" y="192" width="540" height="40" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="148" cy="212" r="8" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>
  <line x1="153" y1="217" x2="158" y2="222" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2" stroke-linecap="round"/>
  <rect x="168" y="205" width="180" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>

  <!-- filter chips -->
  <rect x="680" y="196" width="80" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="772" y="196" width="96" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- table header -->
  <rect x="120" y="252" width="960" height="1" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="120" y="264" width="80" height="12" rx="6" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="280" y="264" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="520" y="264" width="100" height="12" rx="6" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="720" y="264" width="90" height="12" rx="6" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="920" y="264" width="80" height="12" rx="6" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="120" y="287" width="960" height="1" fill="#ffffff" fill-opacity="0.06"/>

  <!-- empty rows (faded ghost rows) -->
  <g fill="#ffffff">
    <rect x="120" y="308" width="40" height="12" rx="6" fill-opacity="0.05"/>
    <rect x="280" y="308" width="140" height="12" rx="6" fill-opacity="0.05"/>
    <rect x="520" y="308" width="110" height="12" rx="6" fill-opacity="0.05"/>
    <rect x="720" y="308" width="80" height="12" rx="6" fill-opacity="0.05"/>
    <rect x="920" y="308" width="60" height="12" rx="6" fill-opacity="0.05"/>
    <rect x="120" y="333" width="960" height="1" fill-opacity="0.04"/>

    <rect x="120" y="354" width="40" height="12" rx="6" fill-opacity="0.04"/>
    <rect x="280" y="354" width="120" height="12" rx="6" fill-opacity="0.04"/>
    <rect x="520" y="354" width="90" height="12" rx="6" fill-opacity="0.04"/>
    <rect x="720" y="354" width="100" height="12" rx="6" fill-opacity="0.04"/>
    <rect x="920" y="354" width="70" height="12" rx="6" fill-opacity="0.04"/>
    <rect x="120" y="379" width="960" height="1" fill-opacity="0.03"/>

    <rect x="120" y="400" width="40" height="12" rx="6" fill-opacity="0.03"/>
    <rect x="280" y="400" width="160" height="12" rx="6" fill-opacity="0.03"/>
    <rect x="520" y="400" width="80" height="12" rx="6" fill-opacity="0.03"/>
    <rect x="720" y="400" width="110" height="12" rx="6" fill-opacity="0.03"/>
    <rect x="920" y="400" width="50" height="12" rx="6" fill-opacity="0.03"/>
  </g>


  <!-- bottom bar suggestion -->
  <rect x="120" y="574" width="960" height="1" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="120" y="588" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="940" y="584" width="60" height="20" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect x="1010" y="584" width="60" height="20" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
