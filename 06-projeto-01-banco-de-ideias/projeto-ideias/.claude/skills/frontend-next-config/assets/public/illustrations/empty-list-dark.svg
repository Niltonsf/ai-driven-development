<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Lista vazia">
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <rect x="0" y="0" width="1200" height="700" fill="url(#bgGlow)"/>

  <!-- Floating ambient dots -->
  <g opacity="0.55">
    <circle cx="170" cy="140" r="3" fill="#f59e0b" opacity="0.7"/>
    <circle cx="1040" cy="180" r="2.5" fill="#fafafa" opacity="0.6"/>
    <circle cx="220" cy="560" r="2.5" fill="#fafafa" opacity="0.4"/>
    <circle cx="990" cy="540" r="3" fill="#f59e0b" opacity="0.6"/>
    <circle cx="600" cy="100" r="2" fill="#fafafa" opacity="0.5"/>
    <circle cx="600" cy="610" r="2" fill="#fafafa" opacity="0.4"/>
  </g>

  <!-- Sparkle decorations -->
  <g opacity="0.85">
    <g transform="translate(260 200)">
      <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z" fill="#f59e0b" opacity="0.85"/>
    </g>
    <g transform="translate(940 470)">
      <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" fill="#fbbf24" opacity="0.7"/>
    </g>
    <g transform="translate(880 220)">
      <path d="M0 -7 L1.7 -1.7 L7 0 L1.7 1.7 L0 7 L-1.7 1.7 L-7 0 L-1.7 -1.7 Z" fill="#fafafa" opacity="0.6"/>
    </g>
  </g>

  <!-- Back card (smaller, slightly tilted) -->
  <g transform="translate(310 230) rotate(-5)" filter="url(#softShadow)" opacity="0.85">
    <rect x="0" y="0" width="500" height="110" rx="18" fill="url(#cardGradient)" stroke="#3f3f46" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="500" height="36" rx="18" fill="url(#topGloss)"/>
    <rect x="28" y="32" width="180" height="14" rx="7" fill="#52525b" opacity="0.9"/>
    <rect x="28" y="58" width="320" height="10" rx="5" fill="#3f3f46" opacity="0.8"/>
    <rect x="28" y="76" width="240" height="10" rx="5" fill="#3f3f46" opacity="0.6"/>
  </g>

  <!-- Front card (main, centered) -->
  <g transform="translate(280 320)" filter="url(#softShadow)">
    <rect x="0" y="0" width="640" height="170" rx="22" fill="url(#cardGradient)" stroke="#52525b" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="640" height="44" rx="22" fill="url(#topGloss)"/>

    <!-- Amber accent bar -->
    <rect x="0" y="0" width="6" height="170" rx="3" fill="url(#amberGlow)"/>

    <!-- Idea bulb icon area -->
    <g transform="translate(48 60)">
      <circle cx="22" cy="22" r="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.5"/>
      <path d="M22 8 C16 8 12 13 12 18 C12 22 14 25 17 27 L17 31 L27 31 L27 27 C30 25 32 22 32 18 C32 13 28 8 22 8 Z M18 33 L26 33 L26 35 L18 35 Z" fill="#f59e0b" opacity="0.95"/>
    </g>

    <!-- Skeleton lines -->
    <rect x="120" y="56" width="220" height="16" rx="8" fill="#71717a" opacity="0.85"/>
    <rect x="120" y="86" width="430" height="11" rx="5.5" fill="#52525b" opacity="0.75"/>
    <rect x="120" y="106" width="380" height="11" rx="5.5" fill="#52525b" opacity="0.55"/>
    <rect x="120" y="126" width="280" height="11" rx="5.5" fill="#52525b" opacity="0.4"/>
  </g>

  <!-- Front card 2 (lower, slightly tilted opposite) -->
  <g transform="translate(360 480) rotate(3)" filter="url(#softShadow)" opacity="0.7">
    <rect x="0" y="0" width="480" height="90" rx="18" fill="url(#cardGradient)" stroke="#3f3f46" stroke-opacity="0.6"/>
    <rect x="28" y="26" width="160" height="12" rx="6" fill="#52525b" opacity="0.8"/>
    <rect x="28" y="48" width="300" height="9" rx="4.5" fill="#3f3f46" opacity="0.7"/>
    <rect x="28" y="64" width="220" height="9" rx="4.5" fill="#3f3f46" opacity="0.5"/>
  </g>

  <!-- Subtle plus sign hinting at "create new" -->
  <g transform="translate(870 350)" opacity="0.85">
    <circle cx="0" cy="0" r="34" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 4"/>
    <rect x="-12" y="-2" width="24" height="4" rx="2" fill="#f59e0b"/>
    <rect x="-2" y="-12" width="4" height="24" rx="2" fill="#f59e0b"/>
  </g>
</svg>
